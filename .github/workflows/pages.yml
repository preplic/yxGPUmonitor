name: Deploy Encrypted GPU Dashboard
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml', '.github/scripts/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const deployPages = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/deploy-pages.cjs');
            await deployPages({ core, github, context, artifactId: process.env.PAGES_ARTIFACT_ID });
