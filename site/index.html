<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>YX GPU Monitor</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/style.css?v=20261116-header-1">
  <script src="./vendor/echarts.min.js" defer></script>
  <script src="./vendor/lucide.min.js" defer></script>
  <!-- Change the entry version when updating the application module. -->
  <script type="module" src="./assets/app.js?v=20261116-average-1"></script>
</head>
<body>
  <section id="authScreen" class="auth-screen">
    <div class="auth-brand"><span class="brand-mark"><i data-lucide="cpu"></i></span><span>YX GPU <b>MONITOR</b></span></div>
    <div class="auth-center">
      <div class="auth-symbol"><i data-lucide="fingerprint"></i></div>
      <div class="auth-heading"><span class="eyebrow">YX COMPUTE</span><h1>计算资源控制台</h1><p>受限访问</p></div>
      <form id="loginForm" class="auth-form">
        <label for="username">服务器用户名</label>
        <div class="input-icon"><i data-lucide="user-round"></i><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="用户名" maxlength="64"></div>
        <label for="password">访问密码</label>
        <div class="input-icon"><i data-lucide="key-round"></i><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="密码" maxlength="256"><button class="icon-button" id="showPassword" type="button" aria-label="显示密码" data-tooltip="显示密码"><i data-lucide="eye"></i></button></div>
        <p id="loginError" class="form-error" role="alert" aria-live="polite"></p>
        <button class="primary-button login-button" type="submit"><i data-lucide="arrow-right"></i><span>进入控制台</span></button>
      </form>
      <div class="auth-foot"><i data-lucide="lock-keyhole"></i><span>授权用户访问</span></div>
    </div>
    <div class="auth-bottom"><span>YX GPU Monitor</span></div>
  </section>

  <div id="app" class="app-shell" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#overview"><span class="brand-mark"><i data-lucide="cpu"></i></span><span><strong>YX GPU</strong><small>MONITOR</small></span></a>
      <div class="nav-label">工作空间</div>
      <nav aria-label="主导航">
        <a href="#overview" data-view="overview"><i data-lucide="layout-dashboard"></i><span>监控总览</span></a>
        <a href="#gpus" data-view="gpus"><i data-lucide="microchip"></i><span>GPU 设备</span><b id="navGpuCount">8</b></a>
        <a href="#users" data-view="users"><i data-lucide="users-round"></i><span>用户用量</span></a>
        <a href="#events" data-view="events"><i data-lucide="activity"></i><span>运行记录</span><span id="eventDot" class="nav-dot" hidden></span></a>
      </nav>
      <div class="sidebar-node"><div class="node-icon"><i data-lucide="server"></i></div><div><strong id="sidebarNode">—</strong><small id="sidebarModel">—</small></div><span class="status-dot" id="sidebarStatus"></span></div>
      <div class="sidebar-bottom"><div class="avatar" id="avatar">U</div><span id="sessionUser"></span><button id="logout" class="icon-button" aria-label="退出登录" data-tooltip="退出登录"><i data-lucide="log-out"></i></button></div>
    </aside>
    <div id="sidebarScrim" class="sidebar-scrim" hidden></div>
    <div class="workspace">
      <header class="topbar">
        <button id="mobileMenu" class="icon-button mobile-menu" aria-label="打开导航" data-tooltip="打开导航"><i data-lucide="menu"></i></button>
        <div class="breadcrumb"><strong id="breadcrumbView">监控总览</strong></div>
        <div class="top-actions"><span id="freshness" class="freshness"></span><button id="themeToggle" class="icon-button" aria-label="切换明暗主题" data-tooltip="切换明暗主题"><i data-lucide="sun"></i></button><span class="toolbar-divider"></span><label class="auto-control"><span>自动刷新</span><input id="autoRefresh" type="checkbox" checked role="switch"><span class="switch-track"></span></label><button id="refresh" class="icon-button" aria-label="刷新数据" data-tooltip="刷新数据"><i data-lucide="refresh-cw"></i></button></div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer class="workspace-footer"><span><span class="status-dot"></span><span id="footerStatus">—</span></span><span id="footerTime">—</span></footer>
    </div>
  </div>
  <dialog id="detailDialog" class="detail-dialog"><div id="detailContent"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
